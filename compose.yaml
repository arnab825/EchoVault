version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.Containerfile
    container_name: echovault-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - OLLAMA_BASE_URL=http://host.containers.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - ALLOW_OFFLINE_MOCK_FALLBACK=true
      - OFFLINE_MODE_STRICT=false
    volumes:
      - echovault_data:/app/data
    networks:
      - echovault_network
    extra_hosts:
      - "host.containers.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend.Containerfile
    container_name: echovault-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - echovault_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  echovault_data:
    name: echovault_data

networks:
  echovault_network:
    name: echovault_network
    driver: bridge
